version: "3.8"

services:
  mgpl-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgpl-app
    restart: unless-stopped
    # AI-043 / AI-056: shutdown waits for the one SQLite call in progress when the
    # signal lands (up to that handle's busy timeout: 10 s for db.ts, 5 s for the
    # others; two calls in the six single-game handlers tracked in #109), then the
    # 5 s drain, which one call on an unregistered per-request handle (library.ts,
    # sync.ts) can extend. Loops of per-item writes check for shutdown between
    # items, so a request's size does not add to that; the one exception,
    # /api/state/import, stays atomic instead (see src/routes/state.ts).
    stop_grace_period: 30s
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_PATH=/app/data/mpgl_app.db
      - RATE_LIMIT_MAX=300
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
